name: SoundKitCommunity
options:
  bundleIdPrefix: com.akrapovic.soundkit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    # Normal builds must not advertise a CarPlay scene or entitlement.
    # Change to YES only after Apple grants the driving-task entitlement and
    # the distribution profile contains it; follow DOCS.md before doing so.
    CARPLAY_ENABLED: NO
targets:
  SoundKitCommunity:
    type: application
    platform: iOS
    sources:
      - path: SoundKitCommunity
        excludes:
          - README.md
          - PrivacyInfo.xcprivacy
      - path: SoundKitCommunity/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.akrapovic.soundkit.community
      INFOPLIST_FILE: SoundKitCommunity/Info.plist
      CODE_SIGN_ENTITLEMENTS: SoundKitCommunity/SoundKitCommunity.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - SoundKitCommunityTests
  SoundKitCommunityTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SoundKitCommunityTests
    dependencies:
      - target: SoundKitCommunity
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.akrapovic.soundkit.community.tests
