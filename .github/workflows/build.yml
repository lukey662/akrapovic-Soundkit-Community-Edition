name: Build Debug APK

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships the Android SDK; setup-android@v3 broke on its licence step.
      - name: Install Android packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0"

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      # Instrumented tests need a device/emulator — run locally via connectedDebugAndroidTest.
      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Verify Paparazzi screenshots
        run: ./gradlew :app:verifyPaparazziDebug --no-daemon

      - name: Assemble phone debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Assemble Wear debug APK
        run: ./gradlew :wear:assembleDebug --no-daemon

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: soundkit-community-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Wear debug APK
        uses: actions/upload-artifact@v4
        with:
          name: soundkit-community-wear-debug-apk
          path: wear/build/outputs/apk/debug/*.apk
