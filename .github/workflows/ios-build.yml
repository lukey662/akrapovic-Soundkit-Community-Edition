name: Build iOS

on:
  push:
    paths:
      - "ios/**"
      - "BLE_PROTOCOL.md"
      - "SPEC.md"
      - "DECISIONS.md"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - "BLE_PROTOCOL.md"
      - "SPEC.md"
      - "DECISIONS.md"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    # macos-15 includes the iOS 18.6 runtime used by the pinned destination below.
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build and test (simulator, unsigned)
        working-directory: ios
        run: |
          xcodebuild -project SoundKitCommunity.xcodeproj \
            -scheme SoundKitCommunity \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.6' \
            CODE_SIGNING_ALLOWED=NO \
            build test
